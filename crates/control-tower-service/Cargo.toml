[package]
name = "control-tower-service"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "Control Tower Service - IPC server for Mihomo management"

[[bin]]
name = "ctsvc"
path = "src/main.rs"

[dependencies]
control-tower-service-core = { path = "../control-tower-service-core" }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "chrono"] }
tracing-appender = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
compact_str = { workspace = true }
dirs = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
actix-web = { workspace = true, features = ["rustls-0_23"] }
actix-rt = { workspace = true }
actix-cors = "0.7"
uuid = { workspace = true }
signal-hook = "0.3"
percent-encoding = "2"
futures = "0.3"

# TLS / HTTPS
rustls = "0.23"
rustls-pemfile = "2.2"
rcgen = { version = "0.13", features = ["x509-parser"] }

# Password hashing / key derivation
bcrypt = "0.16"
argon2 = "0.5"
sha2 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
