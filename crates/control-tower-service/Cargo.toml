[package]
name = "control-tower-service"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
description = "Control Tower Service - IPC server for Mihomo management"

[[bin]]
name = "ctsvc"
path = "src/main.rs"

[dependencies]
control-tower-service-core = { path = "../control-tower-service-core" }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "chrono"] }
tracing-appender = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
compact_str = { workspace = true }
dirs = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
actix-web = { workspace = true }
actix-rt = { workspace = true }
actix-cors = "0.7"
uuid = { workspace = true }
signal-hook = "0.3"
percent-encoding = "2"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
