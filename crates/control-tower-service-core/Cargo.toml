[package]
name = "control-tower-service-core"
version = "0.2.4"
edition = "2024"
rust-version = "1.91"
description = "Core service functionality for Control Tower"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
flate2 = "1"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
tracing = { workspace = true }
libc = { workspace = true }

# Windows-only: extracting the Mihomo release archive. The service itself only
# supports Linux, but the crate can still be built on Windows for tests.
[target.'cfg(windows)'.dependencies]
zip = "2"

[dev-dependencies]
tempfile = "3"
