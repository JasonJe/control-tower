[workspace]
members = [
  "crates/control-tower-service-core",
  "crates/control-tower-service",
  "crates/control-tower-cli",
]
resolver = "2"

[workspace.dependencies]
# Core dependencies
anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
compact_str = "0.8"
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }
libc = "0.2"

# IPC
clash_verge_service_ipc = { version = "2.2.0", features = ["client"], git = "https://github.com/clash-verge-rev/clash-verge-service-ipc" }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }

# Web
actix-web = "4"
actix-rt = "2"
actix-files = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
debug = false
strip = true
overflow-checks = false
rpath = false

[profile.dev]
incremental = true
codegen-units = 64
opt-level = 0
debug = true
strip = "none"
overflow-checks = true
lto = false
rpath = false
