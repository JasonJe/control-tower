services:
  control-tower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control-tower
    restart: unless-stopped
    ports:
      # Mihomo API
      - "9090:9090"
      # HTTP Proxy
      - "7890:7890"
      # SOCKS5 Proxy
      - "7891:7891"
      # Web UI
      - "8080:8080"
    volumes:
      # Mount config directory for persistent storage
      - ./data/config:/app/config:rw
      - ./data/profiles:/app/profiles:rw
      - ./data/logs:/tmp/logs:rw
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/proxies"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - control-tower-net

networks:
  control-tower-net:
    driver: bridge
