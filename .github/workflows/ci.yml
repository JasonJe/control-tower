name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Test & build (Linux)
    runs-on: ubuntu-latest
    # A hung test must fail the job instead of occupying a runner for hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # `--lib --bins` runs the unit tests, including the Linux-only ones:
      # flock-based profiles.yaml locking, 0600/0700 permission checks and the
      # IPC server code are all `#[cfg(unix)]`, so the Windows dev machine
      # cannot cover them.
      #
      # `tests/e2e_test.rs` is deliberately excluded: it spawns the real
      # `ctsvc` binary and needs a machine where the service can bind sockets.
      # Run it manually on Linux with `cargo test -p control-tower-service --test e2e_test`.
      - name: Tests
        run: cargo test --workspace --lib --bins

      - name: Build (release)
        run: cargo build --release --workspace
